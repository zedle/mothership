# nFPM config for the mothership-dkms .deb and .rpm: the extended alienware-wmi kernel module
# as DKMS source. packaging/nfpm/build.sh stages it with `make install-dkms` into
# build/nfpm/dkms and substitutes ${MOTHERSHIP_VERSION}; paths are relative to the repository root.
name: mothership-dkms
arch: all
platform: linux
version: ${MOTHERSHIP_VERSION}
version_schema: semver
release: 1
section: kernel
priority: optional
maintainer: Greg Gage <zedle@zedle.com>
vendor: mothership
homepage: https://github.com/zedle/mothership
license: GPL-2.0-only
description: |-
  Extended alienware-wmi kernel module for mothership (DKMS)
  Linux's alienware-wmi driver with real G-Mode, power adapter information,
  the default thermal profile and the cooling type, built by DKMS for every
  installed kernel that has its headers. It replaces the in-tree module of
  the same name.

depends:
  - dkms

contents:
  - src: build/nfpm/dkms/usr/src/alienware-wmi-mothership-${MOTHERSHIP_VERSION}
    dst: /usr/src/alienware-wmi-mothership-${MOTHERSHIP_VERSION}
    type: tree
  - src: kernel/README.md
    dst: /usr/share/doc/mothership-dkms/README.md
  - src: kernel/LICENSE
    dst: /usr/share/doc/mothership-dkms/copyright
    packager: deb
  - src: kernel/LICENSE
    dst: /usr/share/licenses/mothership-dkms/LICENSE
    type: license
    packager: rpm
  # rpm owns no directory it isn't told about, so name ours (dpkg removes empty ones itself).
  - dst: /usr/share/doc/mothership-dkms
    type: dir
    packager: rpm
  - dst: /usr/share/licenses/mothership-dkms
    type: dir
    packager: rpm

scripts:
  postinstall: build/nfpm/scripts/mothership-dkms.postinstall
  preremove: build/nfpm/scripts/mothership-dkms.preremove
