#
# Extended alienware-wmi (mothership). Replaces the in-tree module of the same
# name: depmod searches "updates" before the kernel's own tree.

PACKAGE_NAME="alienware-wmi-mothership"
PACKAGE_VERSION="1"
AUTOINSTALL="yes"

# 'make' is quoted so DKMS does not append KERNELRELEASE= (which would make
# kbuild think it was called directly).
MAKE[0]="'make' KVER=${kernelver} KDIR=${kernel_source_dir}"

BUILT_MODULE_NAME[0]="alienware-wmi"
BUILT_MODULE_LOCATION[0]="alienware-wmi/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
