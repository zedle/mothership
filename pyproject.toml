[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mothership"
version = "0.1.0"
description = "Lighting, thermal and firmware control for Alienware laptops on Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mothership = "mothership.cli:main"

[tool.setuptools]
packages = ["mothership"]

[tool.setuptools.package-data]
mothership = ["data/*.json"]
