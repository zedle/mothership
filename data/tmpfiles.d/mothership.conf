# Runtime flags shared by mothershipd (user, group mothership), mothership-fire (system,
# group mothership) and the lock screen's refresher:
#   effect      written by the daemon; "fire ..." makes mothership-fire render
#   fire-active present while mothership-fire is sending frames
#   unlocked    touched every few seconds while the session is unlocked (key flares)
#   mute, micmute  present while the default sink/source is muted
d /run/mothership 0775 root mothership -
# Compatibility for lock screens that still refresh /run/kbd-fire/unlocked. Skipped (with a
# warning) while an older kbd-fire setup still creates /run/kbd-fire as a directory.
L /run/kbd-fire - - - - /run/mothership
